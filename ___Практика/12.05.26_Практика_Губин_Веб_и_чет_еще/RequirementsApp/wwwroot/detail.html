<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Детали заявки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="app">
        <a href="index.html">← Назад к списку</a>
        <div id="detail"></div>
    </div>
    <script>
        const statusLabels = {
            "Draft": "Черновик", "InApproval": "На согласовании", "Approved": "Утверждена",
            "Rejected": "Отклонена", "Archived": "Архив",
            0: "Черновик", 1: "На согласовании", 2: "Утверждена", 3: "Отклонена", 4: "Архив"
        };
        const versionStatusLabels = {
            "Draft": "Черновик", "InApproval": "На согласовании", "Approved": "Утверждена", "Rejected": "Отклонена",
            0: "Черновик", 1: "На согласовании", 2: "Утверждена", 3: "Отклонена"
        };

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) window.location.href = 'index.html';

        async function loadDetail() {
            const resp = await fetch(`/api/requirements/${id}`);
            if (!resp.ok) { alert('Заявка не найдена'); return; }
            const req = await resp.json();
            render(req);
        }

        function render(req) {
            let html = `
                <h1>📄 Заявка #${req.id}: ${escapeHtml(req.title)}</h1>
                <p><strong>Статус:</strong> <span class="status-badge ${statusClass(req.status)}">${statusLabels[req.status] || req.status}</span> | 
                <strong>Приоритет:</strong> ${escapeHtml(req.priority)}</p>
                <p><strong>Автор:</strong> ${escapeHtml(req.author?.fullName || '—')}</p>
                <p><strong>Подразделение:</strong> ${escapeHtml(req.department)}</p>
                <p><strong>Ресурс:</strong> ${escapeHtml(req.resource)}</p>
                <p><strong>Тип доступа:</strong> ${escapeHtml(req.accessType)}</p>
                <p><strong>Срок действия:</strong> ${req.expirationDate ? new Date(req.expirationDate).toLocaleDateString() : 'не ограничен'}</p>
                <p><strong>Обоснование:</strong> ${escapeHtml(req.description)}</p>
                <button onclick="editRequirement()" class="secondary">✏️ Редактировать</button>
            `;

            if (req.currentVersion) {
                html += `<h2>✅ Текущая утверждённая версия (v${req.currentVersion.versionNumber})</h2>
                         <p>${escapeHtml(req.currentVersion.title)}: ${escapeHtml(req.currentVersion.description)}</p>`;
            }

            html += `<h3>📚 История версий</h3><div id="versions-container">`;
            req.versions.sort((a,b) => b.versionNumber - a.versionNumber).forEach(v => {
                const isDraft = v.status === 'Draft' || v.status === 0;
                html += `
                    <div class="version-block" id="version-${v.id}">
                        <div class="version-header" onclick="toggleVersion(${v.id})">
                            <span><strong>v${v.versionNumber}</strong> – ${versionStatusLabels[v.status] || v.status}</span>
                            <span>${isDraft ? '<button onclick="event.stopPropagation(); sendForApproval(' + v.id + ')" class="btn" style="padding:0.3rem 0.8rem;">▶ На согласование</button>' : ''}</span>
                        </div>
                        <div class="version-body" id="version-body-${v.id}"></div>
                    </div>`;
            });
            html += `</div>`;
            document.getElementById('detail').innerHTML = html;
        }

        function statusClass(status) {
            const map = {
                Draft: 'status-draft', InApproval: 'status-inapproval',
                Approved: 'status-approved', Rejected: 'status-rejected', Archived: 'status-archived',
                0: 'status-draft', 1: 'status-inapproval', 2: 'status-approved', 3: 'status-rejected', 4: 'status-archived'
            };
            return map[status] || '';
        }

        async function toggleVersion(versionId) {
            const body = document.getElementById(`version-body-${versionId}`);
            if (body.classList.contains('open')) {
                body.classList.remove('open');
                return;
            }
            const resp = await fetch(`/api/requirements/${id}`);
            const req = await resp.json();
            const version = req.versions.find(v => v.id === versionId);
            if (!version) return;

            let inner = `<p><strong>${escapeHtml(version.title)}</strong>: ${escapeHtml(version.description)}</p>`;

            inner += `<h4>👥 Согласования</h4>`;
            if (!version.approvals || version.approvals.length === 0) {
                inner += `<p>Согласующие не назначены.</p>`;
            } else {
                inner += `<ul>`;
                version.approvals.forEach(a => {
                    const decision = a.isApproved === null ? '⏳ Ожидает' : (a.isApproved ? '✅ Утверждено' : '❌ Отклонено');
                    inner += `<li>
                        <strong>${escapeHtml(a.user.fullName)}</strong>: ${decision} – ${escapeHtml(a.comment || '')}`;
                    // Показываем кнопки, только если версия на согласовании И решение ещё не принято
                    if ((version.status === 'InApproval' || version.status === 1) && a.isApproved === null) {
                        inner += ` 
                            <button onclick="approve(${versionId}, ${a.userId}, true)" style="margin-left:1rem; padding:0.2rem 0.5rem;">✅ Утвердить</button>
                            <button onclick="approve(${versionId}, ${a.userId}, false)" style="padding:0.2rem 0.5rem;">❌ Отклонить</button>`;
                    }
                    inner += `</li>`;
                });
                inner += `</ul>`;
            }

            inner += `<h4>💬 Комментарии</h4>`;
            version.comments.forEach(c => {
                inner += `<div class="comment-item"><strong>${escapeHtml(c.user.fullName)}</strong> (${new Date(c.createdDate).toLocaleString()}):<br>${escapeHtml(c.text)}</div>`;
            });
            inner += `<textarea id="comment-text-${versionId}" placeholder="Добавить комментарий..." style="width:100%; margin-top:0.5rem;"></textarea>
                      <button onclick="addComment(${versionId})">Отправить</button>`;

            inner += `<h4>📎 Файлы</h4><ul>`;
            version.attachments.forEach(a => {
                inner += `<li><a href="/api/files/download/${a.id}">${escapeHtml(a.fileName)}</a></li>`;
            });
            inner += `</ul>
                      <div class="file-upload">
                          <input type="file" id="file-input-${versionId}">
                          <button onclick="uploadFile(${versionId})">Загрузить</button>
                      </div>`;

            body.innerHTML = inner;
            body.classList.add('open');
        }

        async function editRequirement() {
            const newTitle = prompt('Новое название', '');
            if (newTitle === null) return;
            const newDesc = prompt('Новое описание', '');
            const newPriority = prompt('Приоритет (Низкий, Средний, Высокий)', '');
            const newDept = prompt('Подразделение', '');
            const newRes = prompt('Ресурс', '');
            const newAccess = prompt('Тип доступа (Чтение, Запись, Администрирование)', '');
            const newExp = prompt('Срок действия (yyyy-mm-dd или пусто)', '');
            await fetch(`/api/requirements/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    title: newTitle, description: newDesc, priority: newPriority,
                    department: newDept, resource: newRes, accessType: newAccess,
                    expirationDate: newExp || null
                })
            });
            loadDetail();
        }

        async function sendForApproval(versionId) {
            await fetch(`/api/requirements/version/${versionId}/send-for-approval`, {method: 'POST'});
            loadDetail();
        }

        async function approve(versionId, userId, isApproved) {
            const comment = prompt('Комментарий (необязательно)', '');
            await fetch(`/api/requirements/version/${versionId}/approve`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({userId, isApproved, comment})
            });
            const body = document.getElementById(`version-body-${versionId}`);
            body.classList.remove('open'); // открыть и закрыть - чтобы перерисовать. Я бы придумала лучше, но было и так времени мало
            await toggleVersion(versionId);
        }

        async function addComment(versionId) {
            const text = document.getElementById(`comment-text-${versionId}`).value;
            const userId = 1;
            await fetch(`/api/requirements/version/${versionId}/comment`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({userId, text})
            });
            const body = document.getElementById(`version-body-${versionId}`);
            body.classList.remove('open');
            await toggleVersion(versionId);
        }

        async function uploadFile(versionId) {
            const input = document.getElementById(`file-input-${versionId}`);
            const file = input.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            await fetch(`/api/files/upload/${versionId}`, {method: 'POST', body: formData});
            const body = document.getElementById(`version-body-${versionId}`);
            body.classList.remove('open');
            await toggleVersion(versionId);
        }

        function escapeHtml(text) {
            return String(text).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]);
        }

        window.addEventListener('DOMContentLoaded', loadDetail);
    </script>
</body>
</html>
