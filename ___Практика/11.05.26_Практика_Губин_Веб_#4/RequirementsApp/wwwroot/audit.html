<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Журнал входа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📋 Журнал попыток входа</h1>
        <table id="auditTable">
            <thead>
                <tr>
                    <th>Время</th><th>Email</th><th>Пользователь</th><th>Успех</th><th>IP</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <a href="index.html">← На главную</a>
    </div>
    <script>
        async function load() {
            const resp = await fetch('/api/audit');
            if (resp.status === 403) { alert('Доступ запрещён'); return; }
            const data = await resp.json();
            const tbody = document.querySelector('#auditTable tbody');
            data.forEach(a => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${new Date(a.attemptTime).toLocaleString()}</td>
                    <td>${a.email}</td>
                    <td>${a.userName || '—'}</td>
                    <td>${a.success ? '✅' : '❌'}</td>
                    <td>${a.ipAddress || ''}</td>
                `;
            });
        }
        load();
    </script>
</body>
</html>
